<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BarberIQ · Intelligent Barbershop OS</title>
  <meta name="description" content="Prepaid wallets, learned rebook reminders, add-on intelligence and an owner dashboard for barbershops.">
  <meta name="theme-color" content="#0B0C0E">

  <!-- Fonts are a progressive enhancement: if there is no connection the CSS
       falls back to a system stack, so a demo on bad wi-fi still looks right. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">

  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💈</text></svg>">
</head>
<body>
  <noscript>
    <div style="padding:40px;text-align:center;font-family:system-ui">
      <h1>JavaScript required</h1>
      <p>BarberIQ needs JavaScript enabled to run.</p>
    </div>
  </noscript>

  <div class="app">
    <div style="margin:auto;text-align:center;padding:40px">
      <div style="font-size:40px">💈</div>
      <p style="color:#888;margin-top:10px">Loading BarberIQ…</p>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>

</html>
